<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Class Attendance Tracker - Check-In</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<section class="login-page">
    <div class="login-card">
        <h1>Student Check-In</h1>
        <p>Use the PIN or the QR link to record attendance</p>

        <div class="form-group">
            <label>Name</label>
            <input id="checkin-name" type="text" placeholder="Full name">
        </div>

        <div class="form-group">
            <label>Student No.</label>
            <input id="checkin-number" type="text" placeholder="Student number">
        </div>

        <div class="form-group">
            <label>PIN</label>
            <input id="checkin-pin" type="text" placeholder="PIN code if not using QR link">
        </div>

        <button class="btn" type="button" onclick="studentCheckIn()">CHECK IN</button>
        <br><br>
        <a href="login.html" class="btn">BACK TO LOGIN</a>
    </div>
</section>

<script src="/rejoice_script.js"></script>
</body>
</html>
